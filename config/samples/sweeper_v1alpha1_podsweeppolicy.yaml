apiVersion: sweeper.omniva.com/v1alpha1
kind: PodSweepPolicy
metadata:
  labels:
    app.kubernetes.io/name: sweeper
    app.kubernetes.io/managed-by: kustomize
  name: stale-batch-pods
spec:
  namespaceSelector: {}
  podSelector: {}
  ttl: 1h  # Go duration such as 72h, 1h30m or 500ms; must be > 0; a day unit (1d) is not supported
  mode: report
