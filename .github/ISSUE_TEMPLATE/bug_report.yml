name: Bug report
description: Report something that isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include relevant PodSweepPolicy YAML, manager logs and events.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Minimal steps to reproduce the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sweeper version
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: k8s-version
    attributes:
      label: Kubernetes version
      placeholder: v1.33.3
  - type: textarea
    id: extra
    attributes:
      label: Anything else we should know?
