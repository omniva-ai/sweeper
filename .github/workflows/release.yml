name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sweeper
  MANIFESTS: ghcr.io/${{ github.repository_owner }}/sweeper-manifests

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Validate tag is SemVer
        env:
          TAG: ${{ github.ref_name }}
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*)?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?$'
          if [[ ! "$TAG" =~ $semver ]]; then
            echo "::error::Tag $TAG is not a valid SemVer version"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tags="$IMAGE:$TAG"
          if [[ "$TAG" != *-* ]]; then
            tags="$tags,$IMAGE:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          sbom: true
          provenance: mode=max

      - name: Render manifests
        env:
          TAG: ${{ github.ref_name }}
        run: make build-installer IMG="$IMAGE:$TAG"

      - name: Push manifests OCI artifact
        id: manifests
        env:
          TAG: ${{ github.ref_name }}
          ORAS_USER: ${{ github.actor }}
          ORAS_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$ORAS_PASSWORD" | oras login ghcr.io -u "$ORAS_USER" --password-stdin
          (cd dist && oras push --image-spec v1.0 \
            --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            "$MANIFESTS:$TAG" install.yaml)
          echo "digest=$(oras resolve "$MANIFESTS:$TAG")" >> "$GITHUB_OUTPUT"

      - name: Sign image and manifests
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          MANIFESTS_DIGEST: ${{ steps.manifests.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$IMAGE_DIGEST"
          cosign sign --yes "$MANIFESTS@$MANIFESTS_DIGEST"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" dist/install.yaml --verify-tag --generate-notes "${prerelease[@]}"
